# imgpost（图邮）bundle patch —— 把本插件的行插进 profile 名单。
# 行用包名注册（不是文件路径）：host 端（exports "."）提供
# send_image / generate_image / imgpost_read_image / imgpost_check_backend
# 四个工具，以及同源的 /dsh-img2/<sha256> 图片路由。
#
# 对外图片基址（例如反向代理域名）不写死在这里，由 profile 的
# cordis.patch.yml 覆盖：
#   - id: imgpost
#     config:
#       publicBaseUrl: 'https://your-public-domain'
- insert:
    - id: imgpost
      name: 'imgpost'
